<svg width="100%" viewBox="0 0 680 425.21" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Famappy architecture — data flow diagram</title>
  <desc>Four-layer architecture diagram showing data flowing from Angular UI components through Feature Facades, Domain Facades, and a generic FirestoreService down to Firebase Firestore, with signals flowing back up.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Layer labels -->
  <text x="36" y="82"  text-anchor="middle" transform="rotate(-90,36,82)"  style="fill:#cbd5e1;font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">UI</text>
  <text x="36" y="178" text-anchor="middle" transform="rotate(-90,36,178)" style="fill:#cbd5e1;font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">Feature</text>
  <text x="36" y="274" text-anchor="middle" transform="rotate(-90,36,274)" style="fill:#cbd5e1;font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">Domain</text>
  <text x="36" y="362" text-anchor="middle" transform="rotate(-90,36,362)" style="fill:#cbd5e1;font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">Data</text>

  <!-- ROW 1 — UI Components -->
  <g>
    <rect x="90"  y="54" width="148" height="56" rx="8" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px"/>
    <text x="164" y="76"  text-anchor="middle" dominant-baseline="central" style="fill:rgb(68,68,65);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Page component</text>
    <text x="164" y="96"  text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">Renders, handles gestures</text>
  </g>
  <g>
    <rect x="266" y="54" width="148" height="56" rx="8" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px"/>
    <text x="340" y="76"  text-anchor="middle" dominant-baseline="central" style="fill:rgb(68,68,65);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Layout primitives</text>
    <text x="340" y="96"  text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">Stack, Inline, Grid…</text>
  </g>
  <g>
    <rect x="442" y="54" width="148" height="56" rx="8" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px"/>
    <text x="516" y="76"  text-anchor="middle" dominant-baseline="central" style="fill:rgb(68,68,65);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Shared UI widgets</text>
    <text x="516" y="96"  text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">Button, Chip, Tag…</text>
  </g>

  <!-- Arrow row 1 → row 2 -->
  <line x1="164" y1="110" x2="164" y2="138" style="stroke:#cbd5e1;stroke-width:0.5px" marker-end="url(#arrow)"/>
  <text x="174" y="128" style="fill:#cbd5e1;font-family:system-ui,sans-serif;font-size:12px">calls</text>
  <line x1="244" y1="148" x2="216" y2="120" style="stroke:#93c5fd;stroke-width:0.5px;stroke-dasharray:3px,3px" marker-end="url(#arrow)"/>
  <text x="250" y="130" style="fill:#93c5fd;font-family:system-ui,sans-serif;font-size:12px">signal()</text>

  <!-- ROW 2 — Feature Facade + State Service -->
  <g>
    <rect x="90"  y="150" width="148" height="56" rx="8" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);stroke-width:0.5px"/>
    <text x="164" y="172" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60,52,137);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Feature facade</text>
    <text x="164" y="192" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83,74,183);font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">UI state, view model</text>
  </g>
  <g>
    <rect x="442" y="150" width="148" height="56" rx="8" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);stroke-width:0.5px"/>
    <text x="516" y="172" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60,52,137);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle">State service</text>
    <text x="516" y="192" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83,74,183);font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">Shared transient state</text>
  </g>
  <!-- Feature ↔ State -->
  <line x1="238" y1="178" x2="440" y2="178" style="stroke:#cbd5e1;stroke-width:0.5px;stroke-dasharray:3px,3px"/>
  <text x="340" y="172" text-anchor="middle" style="fill:#cbd5e1;font-family:system-ui,sans-serif;font-size:12px;text-anchor:middle">signal&lt;State&gt;</text>

  <!-- Arrow row 2 → row 3 -->
  <line x1="164" y1="206" x2="164" y2="234" style="stroke:#cbd5e1;stroke-width:0.5px" marker-end="url(#arrow)"/>
  <text x="174" y="224" style="fill:#cbd5e1;font-family:system-ui,sans-serif;font-size:12px">reads</text>
  <line x1="244" y1="246" x2="216" y2="214" style="stroke:#93c5fd;stroke-width:0.5px;stroke-dasharray:3px,3px" marker-end="url(#arrow)"/>
  <text x="250" y="228" style="fill:#93c5fd;font-family:system-ui,sans-serif;font-size:12px">signal()</text>

  <!-- ROW 3 — Domain Facades -->
  <g>
    <rect x="90"  y="246" width="148" height="56" rx="8" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px"/>
    <text x="164" y="268" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8,80,65);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Domain facade</text>
    <text x="164" y="288" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15,110,86);font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">One per collection</text>
  </g>
  <g>
    <rect x="266" y="246" width="148" height="56" rx="8" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px"/>
    <text x="340" y="268" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8,80,65);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Domain facade</text>
    <text x="340" y="288" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15,110,86);font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">RecipeFacade, etc.</text>
  </g>
  <g>
    <rect x="442" y="246" width="148" height="56" rx="8" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px"/>
    <text x="516" y="268" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8,80,65);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Domain facade</text>
    <text x="516" y="288" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15,110,86);font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">IngredientFacade, etc.</text>
  </g>

  <!-- Arrow row 3 → row 4 -->
  <line x1="340" y1="302" x2="340" y2="330" style="stroke:#cbd5e1;stroke-width:0.5px" marker-end="url(#arrow)"/>
  <line x1="164" y1="302" x2="310" y2="335" style="stroke:#cbd5e1;stroke-width:0.5px" marker-end="url(#arrow)"/>
  <line x1="516" y1="302" x2="370" y2="335" style="stroke:#cbd5e1;stroke-width:0.5px" marker-end="url(#arrow)"/>
  <line x1="380" y1="340" x2="408" y2="308" style="stroke:#93c5fd;stroke-width:0.5px;stroke-dasharray:3px,3px" marker-end="url(#arrow)"/>
  <text x="416" y="316" style="fill:#93c5fd;font-family:system-ui,sans-serif;font-size:12px">onSnapshot</text>

  <!-- ROW 4 — FirestoreService + Firebase -->
  <g>
    <rect x="178" y="342" width="200" height="56" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px"/>
    <text x="278" y="364" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle">FirestoreService</text>
    <text x="278" y="384" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">Generic CRUD + auth scope</text>
  </g>
  <line x1="378" y1="370" x2="420" y2="370" style="stroke:#cbd5e1;stroke-width:0.5px" marker-end="url(#arrow)"/>
  <g>
    <rect x="420" y="342" width="152" height="56" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px"/>
    <text x="496" y="364" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Firebase Firestore</text>
    <text x="496" y="384" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-family:system-ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle">Real-time, user-scoped</text>
  </g>

  <!-- Legend -->
  <line x1="90"  y1="412" x2="116" y2="412" style="stroke:#cbd5e1;stroke-width:0.5px" marker-end="url(#arrow)"/>
  <text x="122" y="416" style="fill:#cbd5e1;font-family:system-ui,sans-serif;font-size:12px">Action / call</text>
  <line x1="210" y1="412" x2="236" y2="412" style="stroke:#93c5fd;stroke-width:0.5px;stroke-dasharray:3px,3px" marker-end="url(#arrow)"/>
  <text x="242" y="416" style="fill:#93c5fd;font-family:system-ui,sans-serif;font-size:12px">Reactive signal</text>
</svg>
